<script>
(function(){
  const transactionPages = ['invoices.html','customers.html','expenses.html','suppliers.html'];
  const accountingPages = transactionPages.concat(['cash-bank.html','budgeting.html','chart-of-accounts.html','journal-entries.html','reports.html']);

  function pageName(){
    const raw = window.location.pathname.split('/').pop() || 'dashboard.html';
    return decodeURIComponent(raw).toLowerCase();
  }

  function setDropdown(name, open){
    const button = document.querySelector('[data-sidebar-toggle="' + name + '"]');
    if(!button) return;
    const menu = document.getElementById(button.getAttribute('aria-controls'));
    if(!menu) return;
    button.classList.toggle('open', open);
    button.setAttribute('aria-expanded', open ? 'true' : 'false');
    menu.hidden = !open;
  }

  function initSidebarDropdowns(){
    const current = pageName();
    document.querySelectorAll('.sb-nav a[href]').forEach(link => {
      const href = (link.getAttribute('href') || '').split('?')[0].toLowerCase();
      link.classList.toggle('active', href === current);
    });

    const isTransaction = transactionPages.includes(current);
    const isAccounting = accountingPages.includes(current);
    setDropdown('accounting', isAccounting);
    setDropdown('transactions', isTransaction);

    const accountingToggle = document.querySelector('[data-sidebar-toggle="accounting"]');
    const transactionsToggle = document.querySelector('[data-sidebar-toggle="transactions"]');
    if(accountingToggle) accountingToggle.classList.toggle('active', isAccounting);
    if(transactionsToggle) transactionsToggle.classList.toggle('active', isTransaction);
  }

  document.addEventListener('click', event => {
    const toggle = event.target.closest('[data-sidebar-toggle]');
    if(!toggle) return;
    event.preventDefault();
    const name = toggle.getAttribute('data-sidebar-toggle');
    const isOpen = toggle.getAttribute('aria-expanded') === 'true';
    setDropdown(name, !isOpen);
    if(name === 'accounting' && isOpen){
      setDropdown('transactions', false);
    }
  });

  window.addEventListener('DOMContentLoaded', initSidebarDropdowns);
  window.initSidebarDropdowns = initSidebarDropdowns;
})();
</script>

<script>
(function(){
  const hrPages=['employee-list.html','add-employee.html','employee-profile.html','leave-absences.html'];
  function currentPage(){return decodeURIComponent((window.location.pathname.split('/').pop()||'').toLowerCase())}
  function setHrSidebar(){
    const current=currentPage();
    const isHr=hrPages.includes(current);
    document.querySelectorAll('.sb-nav a[href]').forEach(link=>{
      const href=(link.getAttribute('href')||'').split('?')[0].toLowerCase();
      if(hrPages.includes(href)) link.classList.toggle('active',href===current);
    });
    const button=document.querySelector('[data-sidebar-toggle="hrm"]');
    if(!button) return;
    const menu=document.getElementById(button.getAttribute('aria-controls'));
    button.classList.toggle('active',isHr);
    button.classList.toggle('open',isHr);
    button.setAttribute('aria-expanded',isHr?'true':'false');
    if(menu) menu.hidden=!isHr;
  }
  window.addEventListener('DOMContentLoaded',setHrSidebar);
})();
</script>
